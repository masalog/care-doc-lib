<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareDocLib - 介護認定申請書 作成アプリ</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header>
        <div class="header-title-row">
            <h1>CareDocLib</h1>
            <p class="header-catchcopy">介護認定申請書を作成します</p>
            <a href="admin.html" class="admin-link">→ 管理画面へ</a>
        </div>
        <p>介護認定申請書 作成アプリ</p>
    </header>

    <main>
        <section class="section">
            <h2>申請書PDF作成</h2>
            <div class="form-group">
                <label for="memberSelect">利用者を選択</label>
                <select id="memberSelect" required>
                    <option value="">-- 選択してください --</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="applyYear">申請年</label>
                    <input type="number" id="applyYear" required>
                </div>
                <div class="form-group">
                    <label for="applyMonth">申請月</label>
                    <input type="number" id="applyMonth" min="1" max="12" required>
                </div>
                <div class="form-group">
                    <label for="applyDay">申請日</label>
                    <input type="number" id="applyDay" min="1" max="31" required>
                </div>
            </div>
            <div class="form-group">
                <label for="changeReason">変更更新理由</label>
                <input type="text" id="changeReason" placeholder="変更更新の場合のみ入力してください">
            </div>
            <div class="pdf-action-row">
                <button id="genBtn" type="button" class="btn btn-primary">PDF生成・プレビュー</button>
                <button id="dlBtn" type="button" class="btn btn-secondary" disabled>ダウンロード</button>
                <button id="openTabBtn" type="button" class="btn btn-secondary">新しいタブで開く</button>
            </div>
            <div id="status" class="status" role="status"></div>
            <div id="banner" role="alert"></div>
            <p id="assets" class="note">アセットを読み込み中...</p>
        </section>
        <section class="preview">
            <div id="previewBar"></div>
            <div id="previewPlaceholder">PDFを生成すると、ここにプレビューが表示されます。</div>
            <iframe id="previewFrame" title="PDFプレビュー" class="is-hidden"></iframe>
        </section>
    </main>

    <footer>
        <ul>
            <li>本テンプレートは、東京都中央区が公開している介護認定申請書の様式を基に作成したものです。</li>
            <li>個人番号、医療保険、特定疾病名の項目は、自動転記の対象としておりません。</li>
        </ul>
    </footer>

    <script src="assets/pdf-lib.min.js"></script>
    <script src="assets/fontkit.umd.min.js"></script>
    <script src="assets/pdf-core.js"></script>
    <script src="assets/pdf-draw.js"></script>
    <script src="assets/pdf-export.js"></script>
    <script src="assets/storage-core.js"></script>
    <script src="assets/storage-crud.js"></script>
    <script src="assets/storage-seed.js"></script>
    <script src="assets/main.js"></script>
</body>
</html>
